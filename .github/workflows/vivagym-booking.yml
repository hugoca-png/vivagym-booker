name: VivaGym Booking Agent

on:
  schedule:
    # 09:25 UTC todos os Domingos. É cedo o suficiente para cobrir tanto
    # hora de Verão (WEST, UTC+1 -> alvo real 09:30 UTC) como hora de
    # Inverno (WET, UTC+0 -> alvo real 10:30 UTC). O script espera pela
    # hora exata em Europe/Lisbon internamente, por isso a folga extra
    # no Inverno só significa ficar mais tempo à espera, sem problema.
    - cron: "25 9 * * 0"
  workflow_dispatch: {}

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr o agente de marcação (API direta)
        env:
          VIVAGYM_EMAIL: ${{ secrets.VIVAGYM_EMAIL }}
          VIVAGYM_PASSWORD: ${{ secrets.VIVAGYM_PASSWORD }}
          GYM_NAME: ${{ vars.GYM_NAME }}
          CLASS_NAME: ${{ vars.CLASS_NAME }}
          CLASS_DAY: ${{ vars.CLASS_DAY }}
          CLASS_TIME: ${{ vars.CLASS_TIME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO }}
        run: python booker_api.py

      - name: Guardar logs e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booker-logs
          path: logs/
          retention-days: 14
