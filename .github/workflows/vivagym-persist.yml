name: VivaGym Persistent Booking

# Lançado de fora (ex: cron-job.org, via API de workflow_dispatch) uma vez por
# dia de abertura. Tenta reservar de 30 em 30 minutos até conseguir, com prazo
# às 23:59 (hora de Lisboa) do dia em que foi lançado. Cada job do GitHub tem no
# máximo 6h, por isso o job relança-se a si próprio (mesmo prazo e mesma aula)
# quando esgota ~5h -- o input "deadline" só é preenchido nesses relançamentos.
#
# Para reservar OUTRAS aulas basta lançar este mesmo workflow com inputs
# diferentes (um cronjob por aula). Input vazio = usa a Variable do repositório
# (GYM_NAME, CLASS_NAME, CLASS_DAY, CLASS_TIME).
on:
  workflow_dispatch:
    inputs:
      gym:
        description: "Ginásio (vazio = Variable GYM_NAME)"
        required: false
        default: ""
      class_name:
        description: "Nome da aula (vazio = Variable CLASS_NAME)"
        required: false
        default: ""
      day:
        description: "Dia da semana, ex: Domingo (vazio = Variable CLASS_DAY)"
        required: false
        default: ""
      time:
        description: "Hora objetivo HH:MM (vazio = Variable CLASS_TIME)"
        required: false
        default: ""
      margin_minutes:
        description: "Margem em minutos à volta da hora (vazio = 60)"
        required: false
        default: ""
      deadline:
        description: "Prazo ISO-8601 (só para relançamentos automáticos; deixar vazio ao lançar)"
        required: false
        default: ""

# Um grupo por aula: aulas diferentes correm em paralelo, a mesma aula não.
concurrency:
  group: vivagym-persist-${{ inputs.class_name || vars.CLASS_NAME }}-${{ inputs.day || vars.CLASS_DAY }}-${{ inputs.time || vars.CLASS_TIME }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr o agente em modo persistente
        id: run
        env:
          VIVAGYM_EMAIL: ${{ secrets.VIVAGYM_EMAIL }}
          VIVAGYM_PASSWORD: ${{ secrets.VIVAGYM_PASSWORD }}
          GYM_NAME: ${{ vars.GYM_NAME }}
          CLASS_NAME: ${{ vars.CLASS_NAME }}
          CLASS_DAY: ${{ vars.CLASS_DAY }}
          CLASS_TIME: ${{ vars.CLASS_TIME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO }}
          RUN_LAUNCHED_AT: ${{ github.run_started_at }}
          IN_GYM: ${{ inputs.gym }}
          IN_CLASS: ${{ inputs.class_name }}
          IN_DAY: ${{ inputs.day }}
          IN_TIME: ${{ inputs.time }}
          IN_MARGIN: ${{ inputs.margin_minutes }}
          IN_DEADLINE: ${{ inputs.deadline }}
        run: |
          args=(--persist --gym "$IN_GYM" --class-name "$IN_CLASS" --day "$IN_DAY" --time "$IN_TIME")
          if [ -n "$IN_MARGIN" ]; then args+=(--margin-minutes "$IN_MARGIN"); fi
          if [ -n "$IN_DEADLINE" ]; then args+=(--deadline "$IN_DEADLINE"); fi
          python booker_api.py "${args[@]}"

      - name: Relançar (continuação até ao mesmo prazo)
        if: steps.run.outputs.relaunch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DEADLINE: ${{ steps.run.outputs.deadline }}
          IN_GYM: ${{ inputs.gym }}
          IN_CLASS: ${{ inputs.class_name }}
          IN_DAY: ${{ inputs.day }}
          IN_TIME: ${{ inputs.time }}
          IN_MARGIN: ${{ inputs.margin_minutes }}
        run: |
          gh workflow run vivagym-persist.yml --ref "${{ github.ref_name }}" \
            -f "deadline=$NEXT_DEADLINE" -f "gym=$IN_GYM" -f "class_name=$IN_CLASS" \
            -f "day=$IN_DAY" -f "time=$IN_TIME" -f "margin_minutes=$IN_MARGIN"

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booker-persist-logs
          path: logs/
          retention-days: 14
