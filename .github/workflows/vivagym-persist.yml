name: VivaGym Persistent Booking

# Lançado de fora (ex: cron-job.org, via API de workflow_dispatch) uma vez por
# dia de abertura. Tenta reservar de 30 em 30 minutos até conseguir, com prazo
# às 23:59 (hora de Lisboa) do dia em que foi lançado. Cada job do GitHub tem no
# máximo 6h, por isso o job relança-se a si próprio (mesmo prazo) quando esgota
# ~5h -- o input "deadline" só é preenchido nesses relançamentos automáticos.
on:
  workflow_dispatch:
    inputs:
      deadline:
        description: "Prazo ISO-8601 (só para relançamentos automáticos; deixar vazio ao lançar)"
        required: false
        default: ""

concurrency:
  group: vivagym-persist
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr o agente em modo persistente
        id: run
        env:
          VIVAGYM_EMAIL: ${{ secrets.VIVAGYM_EMAIL }}
          VIVAGYM_PASSWORD: ${{ secrets.VIVAGYM_PASSWORD }}
          GYM_NAME: ${{ vars.GYM_NAME }}
          CLASS_NAME: ${{ vars.CLASS_NAME }}
          CLASS_DAY: ${{ vars.CLASS_DAY }}
          CLASS_TIME: ${{ vars.CLASS_TIME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO }}
          RUN_LAUNCHED_AT: ${{ github.run_started_at }}
          DEADLINE_INPUT: ${{ inputs.deadline }}
        run: |
          if [ -n "$DEADLINE_INPUT" ]; then
            python booker_api.py --persist --deadline "$DEADLINE_INPUT"
          else
            python booker_api.py --persist
          fi

      - name: Relançar (continuação até ao mesmo prazo)
        if: steps.run.outputs.relaunch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DEADLINE: ${{ steps.run.outputs.deadline }}
        run: gh workflow run vivagym-persist.yml --ref "${{ github.ref_name }}" -f "deadline=$NEXT_DEADLINE"

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booker-persist-logs
          path: logs/
          retention-days: 14
